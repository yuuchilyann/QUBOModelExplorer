<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#2b6cb0"/>
  <!-- A 3x3 Q matrix: negative diagonal, positive off-diagonal. -->
  <g fill="#ffffff">
    <rect x="12" y="12" width="12" height="12" rx="2" opacity="0.95"/>
    <rect x="26" y="12" width="12" height="12" rx="2" opacity="0.4"/>
    <rect x="40" y="12" width="12" height="12" rx="2" opacity="0.25"/>
    <rect x="12" y="26" width="12" height="12" rx="2" opacity="0.4"/>
    <rect x="26" y="26" width="12" height="12" rx="2" opacity="0.95"/>
    <rect x="40" y="26" width="12" height="12" rx="2" opacity="0.4"/>
    <rect x="12" y="40" width="12" height="12" rx="2" opacity="0.25"/>
    <rect x="26" y="40" width="12" height="12" rx="2" opacity="0.4"/>
    <rect x="40" y="40" width="12" height="12" rx="2" opacity="0.95"/>
  </g>
</svg>
